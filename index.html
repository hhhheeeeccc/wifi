<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Hotspot Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 600px;
            height: 500px;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .tabs {
            display: flex;
            background-color: #0f172a50;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background-color: #ffffff05;
        }

        .tab-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .status-card {
            background-color: #ffffff05;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .status-label {
            color: var(--text-muted);
        }

        .status-value {
            font-weight: bold;
        }

        .status-value.on { color: var(--accent-color); }
        .status-value.off { color: #ef4444; }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .client-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .client-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .client-info span {
            display: block;
        }

        .client-mac {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .footer {
            padding: 10px;
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>WiFi Hotspot Pro</h1>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="status">الحالة</button>
            <button class="tab-btn" data-tab="clients">الأجهزة المتصلة</button>
            <button class="tab-btn" data-tab="settings">الإعدادات</button>
        </div>

        <!-- Status Tab -->
        <div id="status" class="tab-content active">
            <div class="status-card">
                <div class="status-row">
                    <span class="status-label">حالة الشبكة:</span>
                    <span id="hotspotStatus" class="status-value off">مغلق</span>
                </div>
                <div class="status-row">
                    <span class="status-label">اسم الشبكة (SSID):</span>
                    <span id="currentSSID" class="status-value">---</span>
                </div>
                <div class="status-row">
                    <span class="status-label">الأجهزة المتصلة:</span>
                    <span id="clientCount" class="status-value">0</span>
                </div>
            </div>

            <button id="startBtn" class="btn btn-primary">تشغيل نقطة الاتصال</button>
            <p id="msg" style="text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--text-muted);"></p>
        </div>

        <!-- Clients Tab -->
        <div id="clients" class="tab-content">
            <ul id="clientList" class="client-list">
                <li style="text-align: center; color: var(--text-muted); margin-top: 20px;">لا توجد أجهزة متصلة حالياً</li>
            </ul>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="tab-content">
            <div class="form-group">
                <label>اسم الشبكة (SSID)</label>
                <input type="text" id="ssid" value="WiFiHotspotPro">
            </div>
            <div class="form-group">
                <label>كلمة المرور (8 أحرف على الأقل)</label>
                <input type="password" id="password" value="Pass1234!">
            </div>
            <button id="saveSettingsBtn" class="btn btn-primary">حفظ الإعدادات</button>
        </div>

        <div class="footer">
            Admin: <span id="adminStatus">...</span> |
            S1 Check: <span id="s1Status">...</span>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
